name: Exe Pruefer & Offline Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    name: Offline Tests & Syntax Gate
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test-Abhaengigkeiten installieren
        run: |
          python -m pip install --quiet -r next-update/developer/tests/requirements-test.txt

      - name: Offline-Regressions- und Strukturtests ausfuehren
        run: |
          python next-update/developer/tests/run_offline_tests.py

  powershell-parse-gate:
    name: Windows PowerShell 5.1 Parse Gate
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: PowerShell Quellcode pruefen
        shell: powershell
        run: |
          $targets = @(
            './next-update/app/ArenaBridge.ps1',
            './next-update/builder/Build-EXE.ps1'
          )
          foreach ($target in $targets) {
            Write-Host "Pruefe $target mit Windows PowerShell 5.1..."
            & ./next-update/builder/parse-gate.ps1 -Path $target
            if ($LASTEXITCODE -ne 0) {
              throw "Parse Gate fehlgeschlagen fuer $target (Exit Code: $LASTEXITCODE)"
            }
          }
          Write-Host "Alle PowerShell-Skripte syntaktisch fehlerfrei!"
