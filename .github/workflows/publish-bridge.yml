# Veroeffentlicht die Bridge automatisch: Sobald die Datei
# next-update/release/ArenaRobloxBridge.exe auf main geaendert wird, erzeugt dieser
# Workflow next-update/release/latest.json (Version, Groesse, Pruefsumme, Adresse)
# und schreibt sie zurueck ins Repository. Alle Bridges pruefen dort beim Start.
#
# Diese Datei muss im Repository-Hauptordner liegen, weil GitHub Workflows nur
# dort liest. Der eigentliche Code liegt in next-update/developer/tools/publish_latest.py.

name: Bridge-Version veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'next-update/release/ArenaRobloxBridge.exe'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bridge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pefile installieren (liest die Dateiversion der EXE)
        run: python -m pip install --quiet pefile

      - name: latest.json aus der EXE erzeugen und pruefen
        run: python next-update/developer/tools/publish_latest.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: latest.json ins Repository zurueckschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-update/release/latest.json
          if git diff --cached --quiet; then
            echo "latest.json ist unveraendert - nichts zu committen."
          else
            git commit -m "Bridge-Version veroeffentlichen: latest.json [skip ci]"
            git push
          fi
